<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050608" />
  <title>Lodi Timer • Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050608;
      --surface: #0f1117;
      --surface-border: #1a1e28;
      --text-main: #f0f3fa;
      --text-dim: #717b94;
      --color-primary: #00e676;
      --color-primary-rgb: 0, 230, 118;
      --font-display: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --dial-border-color: rgba(255, 255, 255, 0.08);
      --dial-bg: transparent;
      --dial-radius: 50%;
    }

    body.color-cyan { --color-primary: #00d4ff; --color-primary-rgb: 0, 212, 255; }
    body.color-amber { --color-primary: #ffb300; --color-primary-rgb: 255, 179, 0; }
    body.color-crimson { --color-primary: #ff334b; --color-primary-rgb: 255, 51, 75; }
    body.color-white { --color-primary: #e6edfa; --color-primary-rgb: 230, 237, 250; }

    body.style-chrono { --font-display: 'Plus Jakarta Sans', sans-serif; }
    body.style-ticks { --font-display: 'Plus Jakarta Sans', sans-serif; }
    body.style-segment { --font-display: 'Share Tech Mono', monospace; letter-spacing: -2px; }
    body.style-monolith { --font-display: 'Plus Jakarta Sans', sans-serif; --dial-bg: var(--color-primary); --text-main: #000000; }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 20px) 16px;
      overflow-x: hidden;
      transition: background-color 0.25s ease;
    }

    header {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 4px;
    }
    .brand { font-size: 15px; font-weight: 700; letter-spacing: 1px; color: var(--text-dim); }
    .brand span { color: var(--color-primary); }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s;
    }
    .icon-btn:active { transform: scale(0.92); }

    .nav-tabs {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      padding: 4px;
      border-radius: 14px;
      display: flex;
      gap: 4px;
      width: 100%;
      max-width: 340px;
      margin-bottom: 8px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    .dial-stage {
      width: 310px;
      height: 310px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--dial-radius);
      background: var(--dial-bg);
      touch-action: pan-x;
      cursor: ns-resize;
    }

    .dial-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .ring-bg { fill: none; stroke: var(--dial-border-color); stroke-width: 6; }
    .ring-progress {
      fill: none;
      stroke: var(--color-primary);
      stroke-width: 6;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      transition: stroke-dashoffset 0.25s linear, stroke 0.3s ease;
      filter: drop-shadow(0 0 6px rgba(var(--color-primary-rgb), 0.45));
    }

    .ticks-container {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: none;
    }
    body.style-ticks .ticks-container { display: block; }
    body.style-ticks .ring-progress, body.style-ticks .ring-bg { display: none; }

    .tick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 10px;
      background: rgba(255, 255, 255, 0.15);
      transform-origin: center -136px;
      border-radius: 1px;
    }
    .tick.active {
      background: var(--color-primary);
      box-shadow: 0 0 4px rgba(var(--color-primary-rgb), 0.6);
    }

    body.style-monolith .ring-progress,
    body.style-monolith .ring-bg,
    body.style-monolith .ticks-container { display: none; }

    .dial-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .state-badge {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 4px;
      min-height: 16px;
    }
    body.style-monolith .state-badge { color: rgba(0, 0, 0, 0.6); }

    .main-digits {
      font-family: var(--font-display);
      font-size: 82px;
      font-weight: 800;
      line-height: 1;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      transition: color 0.2s;
    }
    body.style-monolith .main-digits { color: #000; }

    .sub-hint {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-dim);
      margin-top: 8px;
    }
    body.style-monolith .sub-hint { color: rgba(0, 0, 0, 0.5); }

    .counter-pill {
      margin-top: 22px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .counter-pill.visible { opacity: 1; }
    .counter-pill span { color: var(--color-primary); }

    .quick-adjust {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      width: 100%;
    }
    .pill-btn {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.15s;
    }
    .pill-btn:active { background: rgba(255, 255, 255, 0.1); color: #fff; }

    .presets-carousel {
      width: 100%;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 4px 4px 4px;
      scrollbar-width: none;
    }
    .presets-carousel::-webkit-scrollbar { display: none; }
    .preset-chip {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 12px;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .preset-chip.active {
      border-color: var(--color-primary);
      color: var(--text-main);
    }

    footer {
      width: 100%;
      max-width: 440px;
      display: flex;
      gap: 12px;
      padding-top: 14px;
    }
    .btn {
      flex: 1;
      height: 56px;
      border-radius: 18px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--color-primary);
      color: #000;
      box-shadow: 0 4px 16px rgba(var(--color-primary-rgb), 0.3);
    }
    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      max-width: 80px;
    }

    .drawer {
      position: fixed;
      bottom: -100%;
      left: 0;
      right: 0;
      background: #0d0f15;
      border-top: 1px solid #1f2433;
      border-radius: 26px 26px 0 0;
      padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px;
      z-index: 100;
      transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 480px;
      margin: 0 auto;
    }
    .drawer.open { bottom: 0; }
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .drawer-title { font-size: 17px; font-weight: 700; color: #fff; }
    .drawer-section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      color: var(--text-dim);
      margin: 14px 0 8px 0;
    }

    .style-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .style-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
    }
    .style-card.selected {
      border-color: var(--color-primary);
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .color-swatches { display: flex; gap: 10px; margin-top: 8px; }
    .swatch {
      flex: 1;
      height: 38px;
      border-radius: 10px;
      cursor: pointer;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .swatch.selected { border-color: #fff; }

    .roller-modal-body {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 16px 0;
    }
    .roller-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .roller-col select {
      background: #141822;
      border: 1px solid #252c3d;
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 14px;
      outline: none;
      font-family: inherit;
    }
    .roller-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      margin-top: 6px;
      text-transform: uppercase;
    }

    .history-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .history-item {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-item-date { font-size: 13px; font-weight: 600; }
    .history-item-meta { font-size: 12px; color: var(--text-dim); }
    .history-delete-btn {
      background: transparent;
      border: none;
      color: #ff4757;
      cursor: pointer;
      padding: 4px;
    }
  </style>
</head>
<body class="style-chrono color-green">

  <header>
    <div class="brand">LODI<span>TIMER</span></div>
    <div class="header-actions">
      <button class="icon-btn" id="openHistoryBtn" title="Session History">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </button>
      <button class="icon-btn" id="openStudioBtn" title="Theme & Dial Studio">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" id="tabCountdown">Countdown</button>
    <button class="tab-btn" id="tabStopwatch">Stopwatch</button>
  </div>

  <main>
    <div class="dial-stage" id="dialStage">
      <svg class="dial-svg" viewBox="0 0 320 320">
        <circle class="ring-bg" cx="160" cy="160" r="140" />
        <circle class="ring-progress" id="ringProgress" cx="160" cy="160" r="140" stroke-dasharray="879.64" stroke-dashoffset="0" />
      </svg>
      <div class="ticks-container" id="ticksContainer"></div>

      <div class="dial-content">
        <div class="state-badge" id="stateBadge">60S ROUTINE</div>
        <div class="main-digits" id="mainDigits">60</div>
        <div class="sub-hint" id="subHint">drag or wheel to scrub</div>
      </div>
    </div>

    <div class="counter-pill" id="counterPill">
      Completed Sets: <span id="counterValue">1</span>
    </div>

    <div class="quick-adjust" id="quickAdjustBar">
      <button class="pill-btn" data-sec="-10">-10s</button>
      <button class="pill-btn" data-sec="30">30s</button>
      <button class="pill-btn" data-sec="60" style="border-color: var(--color-primary); color: #fff;">60s</button>
      <button class="pill-btn" data-sec="+10">+10s</button>
      <button class="pill-btn" id="openRollerBtn">Roller ⏱️</button>
    </div>

    <div class="presets-carousel" id="presetsBar">
      <button class="preset-chip active" data-time="60">🧘 60s Spine</button>
      <button class="preset-chip" data-time="180">🍳 3m Pan Heat</button>
      <button class="preset-chip" data-time="660">🍝 11m Pasta</button>
      <button class="preset-chip" data-time="240">🫖 4m Tea</button>
    </div>
  </main>

  <footer>
    <button class="btn btn-secondary" id="resetBtn" title="Reset">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button class="btn btn-primary" id="mainActionBtn">START</button>
  </footer>

  <div class="drawer-overlay" id="overlay"></div>

  <!-- Studio Drawer -->
  <div class="drawer" id="studioDrawer">
    <div class="drawer-header">
      <div class="drawer-title">Dial Studio & Skins</div>
      <button class="icon-btn" id="closeStudioBtn">✕</button>
    </div>

    <div class="drawer-section-label">Dial Architecture</div>
    <div class="style-grid">
      <div class="style-card selected" data-style="chrono">Chrono Minimal</div>
      <div class="style-card" data-style="ticks">Tachymeter Ticks</div>
      <div class="style-card" data-style="segment">Retro Segment</div>
      <div class="style-card" data-style="monolith">Solid Monolith</div>
    </div>

    <div class="drawer-section-label">Accent Luminescence</div>
    <div class="color-swatches">
      <div class="swatch selected" data-color="green" style="background: #00e676;"></div>
      <div class="swatch" data-color="cyan" style="background: #00d4ff;"></div>
      <div class="swatch" data-color="amber" style="background: #ffb300;"></div>
      <div class="swatch" data-color="crimson" style="background: #ff334b;"></div>
      <div class="swatch" data-color="white" style="background: #e6edfa;"></div>
    </div>

    <button class="btn btn-primary" id="saveDefaultThemeBtn" style="margin-top: 20px; width: 100%; height: 46px; font-size: 14px;">
      Save As Permanent Default
    </button>
  </div>

  <!-- Roller Time Picker Drawer -->
  <div class="drawer" id="rollerDrawer">
    <div class="drawer-header">
      <div class="drawer-title">Exact Time Setter</div>
      <button class="icon-btn" id="closeRollerBtn">✕</button>
    </div>
    <div class="roller-modal-body">
      <div class="roller-col">
        <select id="rollerMinutes"></select>
        <div class="roller-label">Minutes</div>
      </div>
      <div style="font-size: 32px; font-weight: 800; color: var(--text-dim);">:</div>
      <div class="roller-col">
        <select id="rollerSeconds"></select>
        <div class="roller-label">Seconds</div>
      </div>
    </div>
    <button class="btn btn-primary" id="applyRollerBtn" style="width: 100%; height: 48px; margin-top: 14px;">Set Countdown</button>
  </div>

  <!-- History Drawer -->
  <div class="drawer" id="historyDrawer">
    <div class="drawer-header">
      <div class="drawer-title">Exercise Sessions</div>
      <button class="icon-btn" id="closeHistoryBtn">✕</button>
    </div>
    <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 8px;">
      *Only 60s spinal routine sessions are logged.
    </div>
    <div class="history-list" id="historyListContainer"></div>
    <button class="btn btn-secondary" id="exportCsvBtn" style="width: 100%; max-width: 100%; height: 44px; margin-top: 14px; font-size: 13px;">
      Export to CSV (Google Sheets)
    </button>
  </div>

  <script>
    let mode = 'countdown';
    let targetSeconds = 60;
    let remainingSeconds = 60;
    let timerState = 'idle';
    let timerInterval = null;
    let restSeconds = 0;
    let completedSets = 0;
    let wakeLock = null;

    let stopwatchSeconds = 0;
    let stopwatchInterval = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 880, duration = 0.12, type = 'sine') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playBeepSequence(count, intervalMs = 260) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => playBeep(920, 0.14), i * intervalMs);
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }
    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    const ticksContainer = document.getElementById('ticksContainer');
    for (let i = 0; i < 60; i++) {
      const tick = document.createElement('div');
      tick.className = 'tick';
      tick.style.transform = `rotate(${i * 6}deg)`;
      ticksContainer.appendChild(tick);
    }

    const mainDigits = document.getElementById('mainDigits');
    const stateBadge = document.getElementById('stateBadge');
    const ringProgress = document.getElementById('ringProgress');
    const counterPill = document.getElementById('counterPill');
    const counterValue = document.getElementById('counterValue');
    const mainActionBtn = document.getElementById('mainActionBtn');
    const resetBtn = document.getElementById('resetBtn');
    const subHint = document.getElementById('subHint');

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateDisplay() {
      const CIRCUMFERENCE = 879.64;
      if (mode === 'countdown') {
        if (timerState === 'resting') {
          mainDigits.textContent = formatTime(restSeconds);
          stateBadge.textContent = 'REST / BREAK';
          subHint.textContent = 'Press > for next set';
          ringProgress.style.strokeDashoffset = '0';
          return;
        }

        if (targetSeconds <= 60) {
          mainDigits.textContent = remainingSeconds;
        } else {
          mainDigits.textContent = formatTime(remainingSeconds);
        }

        const progress = (targetSeconds - remainingSeconds) / targetSeconds;
        const offset = CIRCUMFERENCE * progress;
        ringProgress.style.strokeDashoffset = -offset;

        const activeTicks = Math.round((remainingSeconds / targetSeconds) * 60);
        const ticks = ticksContainer.children;
        for (let i = 0; i < 60; i++) {
          ticks[i].classList.toggle('active', i < activeTicks);
        }

        if (timerState === 'idle') {
          stateBadge.textContent = targetSeconds === 60 ? '60S ROUTINE' : 'CUSTOM TIMER';
          subHint.textContent = 'drag or wheel to scrub';
        } else if (timerState === 'running') {
          stateBadge.textContent = 'EXERCISING';
          subHint.textContent = 'keep posture aligned';
        }
      } else {
        const hrs = Math.floor(stopwatchSeconds / 3600);
        const mins = Math.floor((stopwatchSeconds % 3600) / 60);
        const secs = stopwatchSeconds % 60;
        if (hrs > 0) {
          mainDigits.textContent = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        } else {
          mainDigits.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }
        stateBadge.textContent = 'STOPWATCH';
        subHint.textContent = 'count up mode';
      }
    }

    function startCountdown() {
      timerState = 'running';
      mainActionBtn.textContent = 'PAUSE';
      mainActionBtn.classList.remove('btn-primary');
      mainActionBtn.classList.add('btn-secondary');
      requestWakeLock();

      timerInterval = setInterval(() => {
        if (remainingSeconds > 1) {
          remainingSeconds--;
          updateDisplay();
        } else {
          remainingSeconds = 0;
          updateDisplay();
          clearInterval(timerInterval);
          completedSets++;
          counterValue.textContent = completedSets;
          counterPill.classList.add('visible');

          playBeepSequence(3, 180);
          if ('vibrate' in navigator) navigator.vibrate([150, 80, 150]);

          startRestInterval();
        }
      }, 1000);
    }

    function startRestInterval() {
      timerState = 'resting';
      restSeconds = 0;
      mainActionBtn.textContent = 'NEXT SET (>)';
      mainActionBtn.classList.remove('btn-secondary');
      mainActionBtn.classList.add('btn-primary');
      updateDisplay();

      timerInterval = setInterval(() => {
        restSeconds++;
        updateDisplay();

        if (restSeconds > 0 && restSeconds % 60 === 0) {
          const minuteNumber = restSeconds / 60;
          if (minuteNumber <= 4) {
            playBeepSequence(minuteNumber, 240);
          } else if (minuteNumber >= 5) {
            playBeepSequence(5, 180);
            pauseTimer();
            stateBadge.textContent = 'AUTO-STOPPED (IDLE)';
            releaseWakeLock();
          }
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      if (timerState === 'running') timerState = 'paused';
      mainActionBtn.textContent = timerState === 'resting' ? 'RESUME REST' : 'RESUME';
      mainActionBtn.classList.remove('btn-secondary');
      mainActionBtn.classList.add('btn-primary');
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      if (targetSeconds === 60 && completedSets > 0) {
        saveSessionRecord(completedSets);
      }
      timerState = 'idle';
      remainingSeconds = targetSeconds;
      restSeconds = 0;
      completedSets = 0;
      counterPill.classList.remove('visible');
      mainActionBtn.textContent = 'START';
      mainActionBtn.classList.remove('btn-secondary');
      mainActionBtn.classList.add('btn-primary');
      releaseWakeLock();
      updateDisplay();
    }

    mainActionBtn.addEventListener('click', () => {
      if (mode === 'countdown') {
        if (timerState === 'idle') {
          startCountdown();
        } else if (timerState === 'running') {
          pauseTimer();
        } else if (timerState === 'paused') {
          startCountdown();
        } else if (timerState === 'resting') {
          clearInterval(timerInterval);
          remainingSeconds = targetSeconds;
          startCountdown();
        }
      } else {
        if (stopwatchInterval) {
          clearInterval(stopwatchInterval);
          stopwatchInterval = null;
          mainActionBtn.textContent = 'RESUME';
        } else {
          mainActionBtn.textContent = 'STOP';
          requestWakeLock();
          stopwatchInterval = setInterval(() => {
            stopwatchSeconds++;
            updateDisplay();
          }, 1000);
        }
      }
    });

    resetBtn.addEventListener('click', () => {
      if (mode === 'countdown') {
        resetTimer();
      } else {
        clearInterval(stopwatchInterval);
        stopwatchInterval = null;
        stopwatchSeconds = 0;
        mainActionBtn.textContent = 'START';
        updateDisplay();
        releaseWakeLock();
      }
    });

    const dialStage = document.getElementById('dialStage');
    let startY = 0;
    dialStage.addEventListener('wheel', (e) => {
      if (timerState !== 'idle') return;
      e.preventDefault();
      const delta = e.deltaY < 0 ? 5 : -5;
      targetSeconds = Math.max(5, Math.min(3600, targetSeconds + delta));
      remainingSeconds = targetSeconds;
      updateDisplay();
    }, { passive: false });

    dialStage.addEventListener('touchstart', (e) => {
      if (timerState !== 'idle') return;
      startY = e.touches[0].clientY;
    });
    dialStage.addEventListener('touchmove', (e) => {
      if (timerState !== 'idle') return;
      const currentY = e.touches[0].clientY;
      const diff = startY - currentY;
      if (Math.abs(diff) > 18) {
        const step = diff > 0 ? 5 : -5;
        targetSeconds = Math.max(5, Math.min(3600, targetSeconds + step));
        remainingSeconds = targetSeconds;
        startY = currentY;
        updateDisplay();
      }
    });

    document.getElementById('quickAdjustBar').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-sec]');
      if (!btn || timerState !== 'idle') return;
      const val = btn.dataset.sec;
      if (val.startsWith('+')) targetSeconds = Math.min(3600, targetSeconds + parseInt(val.slice(1)));
      else if (val.startsWith('-')) targetSeconds = Math.max(5, targetSeconds - parseInt(val.slice(1)));
      else targetSeconds = parseInt(val);
      remainingSeconds = targetSeconds;
      updateDisplay();
    });

    document.getElementById('presetsBar').addEventListener('click', (e) => {
      const chip = e.target.closest('.preset-chip');
      if (!chip || timerState !== 'idle') return;
      document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      targetSeconds = parseInt(chip.dataset.time);
      remainingSeconds = targetSeconds;
      updateDisplay();
    });

    const overlay = document.getElementById('overlay');
    function openDrawer(id) {
      overlay.classList.add('open');
      document.getElementById(id).classList.add('open');
    }
    function closeAllDrawers() {
      overlay.classList.remove('open');
      document.querySelectorAll('.drawer').forEach(d => d.classList.remove('open'));
    }
    overlay.addEventListener('click', closeAllDrawers);

    document.getElementById('openStudioBtn').addEventListener('click', () => openDrawer('studioDrawer'));
    document.getElementById('closeStudioBtn').addEventListener('click', closeAllDrawers);

    document.querySelectorAll('.style-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.style-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        document.body.className = document.body.className.replace(/style-\w+/g, '');
        document.body.classList.add(`style-${card.dataset.style}`);
      });
    });

    document.querySelectorAll('.swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        swatch.classList.add('selected');
        document.body.className = document.body.className.replace(/color-\w+/g, '');
        document.body.classList.add(`color-${swatch.dataset.color}`);
      });
    });

    document.getElementById('saveDefaultThemeBtn').addEventListener('click', () => {
      const currentStyle = document.querySelector('.style-card.selected')?.dataset.style || 'chrono';
      const currentColor = document.querySelector('.swatch.selected')?.dataset.color || 'green';
      localStorage.setItem('lodi_default_style', currentStyle);
      localStorage.setItem('lodi_default_color', currentColor);
      closeAllDrawers();
    });

    const mSel = document.getElementById('rollerMinutes');
    const sSel = document.getElementById('rollerSeconds');
    for (let i = 0; i <= 60; i++) mSel.add(new Option(String(i).padStart(2, '0'), i));
    for (let i = 0; i < 60; i += 5) sSel.add(new Option(String(i).padStart(2, '0'), i));

    document.getElementById('openRollerBtn').addEventListener('click', () => {
      if (timerState !== 'idle') return;
      mSel.value = Math.floor(targetSeconds / 60);
      sSel.value = targetSeconds % 60;
      openDrawer('rollerDrawer');
    });
    document.getElementById('closeRollerBtn').addEventListener('click', closeAllDrawers);
    document.getElementById('applyRollerBtn').addEventListener('click', () => {
      const total = (parseInt(mSel.value) * 60) + parseInt(sSel.value);
      if (total > 0) {
        targetSeconds = total;
        remainingSeconds = total;
        updateDisplay();
      }
      closeAllDrawers();
    });

    function getHistory() {
      return JSON.parse(localStorage.getItem('lodi_timer_history') || '[]');
    }
    function saveSessionRecord(sets) {
      const history = getHistory();
      const now = new Date();
      history.unshift({
        id: Date.now(),
        dateStr: now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
        timeStr: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
        sets: sets
      });
      localStorage.setItem('lodi_timer_history', JSON.stringify(history.slice(0, 100)));
    }

    function renderHistory() {
      const history = getHistory();
      const container = document.getElementById('historyListContainer');
      container.innerHTML = '';
      if (!history.length) {
        container.innerHTML = '<div style="color:var(--text-dim);font-size:13px;padding:12px 0;">No completed 60s sessions logged yet.</div>';
        return;
      }
      history.forEach(item => {
        const row = document.createElement('div');
        row.className = 'history-item';
        row.innerHTML = `
          <div>
            <div class="history-item-date">${item.dateStr} at ${item.timeStr}</div>
            <div class="history-item-meta">60s × ${item.sets} Sets</div>
          </div>
          <button class="history-delete-btn" data-id="${item.id}" title="Delete session">✕</button>
        `;
        container.appendChild(row);
      });
    }

    document.getElementById('openHistoryBtn').addEventListener('click', () => {
      renderHistory();
      openDrawer('historyDrawer');
    });
    document.getElementById('closeHistoryBtn').addEventListener('click', closeAllDrawers);

    document.getElementById('historyListContainer').addEventListener('click', (e) => {
      const btn = e.target.closest('.history-delete-btn');
      if (!btn) return;
      if (confirm('Delete this routine session?')) {
        const id = parseInt(btn.dataset.id);
        const updated = getHistory().filter(h => h.id !== id);
        localStorage.setItem('lodi_timer_history', JSON.stringify(updated));
        renderHistory();
      }
    });

    document.getElementById('exportCsvBtn').addEventListener('click', () => {
      const history = getHistory();
      if (!history.length) return alert('No session records to export.');
      let csv = 'ID,Date,Time,Routine,Sets\n';
      history.forEach(h => {
        csv += `${h.id},"${h.dateStr}","${h.timeStr}",60s Routine,${h.sets}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `lodi-timer-history-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    const tabCountdown = document.getElementById('tabCountdown');
    const tabStopwatch = document.getElementById('tabStopwatch');
    const quickAdjust = document.getElementById('quickAdjustBar');
    const presetsBar = document.getElementById('presetsBar');

    tabCountdown.addEventListener('click', () => {
      if (mode === 'countdown') return;
      mode = 'countdown';
      tabCountdown.classList.add('active');
      tabStopwatch.classList.remove('active');
      quickAdjust.style.display = 'flex';
      presetsBar.style.display = 'flex';
      resetTimer();
    });

    tabStopwatch.addEventListener('click', () => {
      if (mode === 'stopwatch') return;
      mode = 'stopwatch';
      tabStopwatch.classList.add('active');
      tabCountdown.classList.remove('active');
      quickAdjust.style.display = 'none';
      presetsBar.style.display = 'none';
      counterPill.classList.remove('visible');
      stopwatchSeconds = 0;
      mainActionBtn.textContent = 'START';
      mainActionBtn.classList.remove('btn-secondary');
      mainActionBtn.classList.add('btn-primary');
      updateDisplay();
    });

    (function initSavedPrefs() {
      const savedStyle = localStorage.getItem('lodi_default_style') || 'chrono';
      const savedColor = localStorage.getItem('lodi_default_color') || 'green';
      document.body.className = `style-${savedStyle} color-${savedColor}`;

      document.querySelectorAll('.style-card').forEach(c => {
        c.classList.toggle('selected', c.dataset.style === savedStyle);
      });
      document.querySelectorAll('.swatch').forEach(s => {
        s.classList.toggle('selected', s.dataset.color === savedColor);
      });
    })();

    updateDisplay();
  </script>
</body>
</html>
