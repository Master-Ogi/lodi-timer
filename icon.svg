<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#252e42" stroke-width="18"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffb300" stroke-width="18" stroke-dasharray="1068" stroke-dashoffset="320" stroke-linecap="round" filter="url(#glow)"/>
  <text x="256" y="275" font-family="-apple-system, system-ui, sans-serif" font-size="130" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">60</text>
  <text x="256" y="345" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffb300" text-anchor="middle" letter-spacing="4">SEC</text>
</svg>
